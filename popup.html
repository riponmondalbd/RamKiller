<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ram Killer Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b1120;
        --surface: rgba(30, 41, 59, 0.65);
        --surface-hover: rgba(51, 65, 85, 0.65);
        --accent: #fb923c;
        --accent-strong: #f97316;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --border: rgba(255, 255, 255, 0.08);
        --border-hover: rgba(255, 255, 255, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at 50% -20%, rgba(251, 146, 60, 0.18), transparent 60%),
          var(--bg);
        color: var(--text);
        margin: 0;
        padding: 0;
        width: 340px;
        overflow: hidden;
      }

      .container {
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .logo-wrap {
        width: 32px;
        height: 32px;
        border-radius: 9px;
        background: rgba(251, 146, 60, 0.12);
        border: 1px solid rgba(251, 146, 60, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .logo-wrap img {
        width: 22px;
        height: 22px;
        border-radius: 5px;
      }

      .brand-text h1 {
        font-size: 16px;
        margin: 0;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }

      .brand-sub {
        font-size: 11px;
        color: var(--text-muted);
        font-weight: 500;
      }

      .icon-btn {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text-muted);
        width: 34px;
        height: 34px;
        border-radius: 9px;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .icon-btn:hover {
        color: var(--text);
        background: var(--surface-hover);
        border-color: var(--border-hover);
        transform: translateY(-1px);
      }

      .ram-saved {
        background: linear-gradient(135deg, #fb923c 0%, #ea580c 100%);
        padding: 16px 18px;
        border-radius: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 10px 24px -6px rgba(249, 115, 22, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.25);
        position: relative;
        overflow: hidden;
      }

      .ram-info h3 {
        margin: 0 0 4px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.85);
      }

      .ram-info .value {
        font-size: 26px;
        font-weight: 700;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }

      .ram-icon-box {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.16);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .ram-icon-box svg {
        width: 24px;
        height: 24px;
        color: #ffffff;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .stat-card {
        background: var(--surface);
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        backdrop-filter: blur(10px);
        transition: border-color 0.2s;
      }

      .stat-card:hover {
        border-color: var(--border-hover);
      }

      .stat-label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 600;
        margin-bottom: 4px;
      }

      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--text-muted);
      }

      .dot.accent {
        background: var(--accent);
        box-shadow: 0 0 8px rgba(251, 146, 60, 0.7);
      }

      .stat-value {
        font-size: 22px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .stat-value span {
        color: var(--accent);
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .whitelist-btn {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
      }

      .whitelist-btn:hover:not(:disabled) {
        border-color: rgba(251, 146, 60, 0.5);
        background: rgba(251, 146, 60, 0.1);
      }

      .whitelist-btn.whitelisted {
        background: rgba(16, 185, 129, 0.14);
        border-color: rgba(16, 185, 129, 0.4);
        color: #34d399;
      }

      .whitelist-btn.whitelisted:hover:not(:disabled) {
        background: rgba(239, 68, 68, 0.14);
        border-color: rgba(239, 68, 68, 0.45);
        color: #f87171;
      }

      .whitelist-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .whitelist-domain {
        max-width: 210px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .primary-btn {
        background: linear-gradient(135deg, #fb923c 0%, #f97316 100%);
        color: #ffffff;
        border: none;
        padding: 12px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 4px 14px rgba(249, 115, 22, 0.28);
      }

      .primary-btn:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 6px 18px rgba(249, 115, 22, 0.4);
      }

      .primary-btn:active:not(:disabled) {
        transform: translateY(0);
      }

      .primary-btn:disabled {
        opacity: 0.75;
        cursor: wait;
      }

      .secondary-btn {
        background: transparent;
        color: var(--text-muted);
        border: 1px solid var(--border);
        padding: 9px;
        border-radius: 9px;
        font-size: 12px;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.2s;
      }

      .secondary-btn:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.04);
        border-color: var(--border-hover);
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
      }

      .scanning {
        animation: pulse 1.2s infinite ease-in-out;
      }

      .footer {
        text-align: center;
        padding-top: 2px;
        font-size: 11px;
        color: var(--text-muted);
      }

      .footer a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s;
      }

      .footer a:hover {
        color: var(--accent-strong);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="logo-group">
          <div class="logo-wrap">
            <img src="icon_48.png" alt="logo" />
          </div>
          <div class="brand-text">
            <h1>Ram Killer <span style="color: var(--accent)">Pro</span></h1>
            <div class="brand-sub">Auto Tab Suspender</div>
          </div>
        </div>
        <button id="settings" class="icon-btn" title="Settings">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
            />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </header>

      <div class="ram-saved">
        <div class="ram-info">
          <h3>Est. Memory Recovered</h3>
          <div class="value" id="ramValue">0 MB</div>
        </div>
        <div class="ram-icon-box">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
          </svg>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label"><span class="dot accent"></span>Suspended</div>
          <div class="stat-value"><span id="count">0</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-label"><span class="dot"></span>Total Tabs</div>
          <div class="stat-value" id="totalTabs">0</div>
        </div>
      </div>

      <div class="actions">
        <button id="whitelistBtn" class="whitelist-btn" disabled>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
          <span id="whitelistText" class="whitelist-domain">Checking site...</span>
        </button>
        <button id="killNow" class="primary-btn">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 11V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h6" />
            <path d="m12 12 4 10 1.7-4.3L22 16Z" />
          </svg>
          Kill Idle Tabs Now
        </button>
        <button id="resetStats" class="secondary-btn">Reset Stats</button>
      </div>

      <div class="footer">
        Developed by <a href="https://riponmondalbd.vercel.app/" target="_blank">Ripon</a>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
