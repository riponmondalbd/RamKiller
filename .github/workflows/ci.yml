name: CI/CD - Ram Killer Pro

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-test:
    name: Validate & Test Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate manifest.json and referenced assets
        run: |
          node -e '
            const fs = require("fs");
            const assert = require("assert");
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            assert.strictEqual(manifest.manifest_version, 3, "Must be Manifest V3");
            assert.ok(manifest.name && manifest.version, "Name and version required");
            const filesToCheck = [
              manifest.background?.service_worker,
              manifest.action?.default_popup,
              manifest.options_page,
              ...Object.values(manifest.icons || {}),
              ...Object.values(manifest.action?.default_icon || {}),
              "popup.js",
              "options.js",
              "suspended.html",
              "suspended.js",
            ].filter(Boolean);
            for (const f of new Set(filesToCheck)) {
              assert.ok(fs.existsSync(f), `Missing referenced file: ${f}`);
            }
            console.log("manifest.json and all referenced files verified.");
          '

      - name: Check JavaScript syntax
        run: |
          node --check background.js
          node --check popup.js
          node --check options.js
          node --check suspended.js

      - name: Run extension integration tests
        run: node tests/extension.test.js

  package:
    name: Package Extension ZIP
    needs: validate-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build distribution ZIP
        run: |
          mkdir -p dist
          zip -r dist/ram-killer-pro.zip \
            manifest.json \
            background.js \
            popup.html \
            popup.js \
            options.html \
            options.js \
            suspended.html \
            suspended.js \
            icon_16.png \
            icon_48.png \
            icon_128.png

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: ram-killer-pro
          path: dist/ram-killer-pro.zip

      - name: Create GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ram-killer-pro.zip
          generate_release_notes: true
