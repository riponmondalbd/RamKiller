<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tab Suspended - Ram Killer Pro</title>
    <link rel="icon" type="image/png" href="icon_48.png" />
    <style>
      :root {
        --bg: #0f172a;
        --surface: rgba(30, 41, 59, 0.8);
        --accent: #fb923c;
        --accent-hover: #f97316;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --border: rgba(255, 255, 255, 0.1);
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        cursor: pointer;
        user-select: none;
        padding: 24px;
        box-sizing: border-box;
      }

      .card {
        max-width: 520px;
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      }

      .badge {
        display: inline-block;
        background: rgba(251, 146, 60, 0.15);
        color: var(--accent);
        border: 1px solid rgba(251, 146, 60, 0.3);
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-bottom: 16px;
      }

      .site-header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 8px;
      }

      .favicon {
        width: 24px;
        height: 24px;
        border-radius: 4px;
        display: none;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        word-break: break-word;
      }

      .url {
        color: var(--text-muted);
        font-size: 13px;
        margin: 8px 0 24px;
        word-break: break-all;
      }

      .reload-btn {
        background: var(--accent);
        color: #ffffff;
        border: none;
        padding: 12px 24px;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s, transform 0.15s;
      }

      .reload-btn:hover {
        background: var(--accent-hover);
        transform: translateY(-1px);
      }

      .hint {
        margin-top: 14px;
        font-size: 12px;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">Tab Suspended to Save RAM</div>
      <div class="site-header">
        <img id="favicon" class="favicon" alt="" />
        <h1 id="pageTitle">Suspended Tab</h1>
      </div>
      <div id="pageUrl" class="url"></div>
      <button id="reloadBtn" class="reload-btn">Reload Tab</button>
      <div class="hint">Click anywhere on this page to reload</div>
    </div>
    <script src="suspended.js"></script>
  </body>
</html>
