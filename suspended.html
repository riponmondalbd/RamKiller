<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tab Suspended - Ram Killer Pro</title>
    <link rel="icon" type="image/png" href="icon_48.png" />
    <style>
      :root {
        --bg: #0b1120;
        --surface: rgba(30, 41, 59, 0.72);
        --accent: #fb923c;
        --accent-hover: #f97316;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --border: rgba(255, 255, 255, 0.09);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 25%, rgba(251, 146, 60, 0.14), transparent 55%),
          var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        cursor: pointer;
        user-select: none;
        padding: 24px;
      }

      .card {
        max-width: 540px;
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 36px 32px;
        text-align: center;
        backdrop-filter: blur(12px);
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
        transition: border-color 0.2s, transform 0.2s;
      }

      body:hover .card {
        border-color: rgba(251, 146, 60, 0.35);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(251, 146, 60, 0.14);
        color: var(--accent);
        border: 1px solid rgba(251, 146, 60, 0.3);
        padding: 5px 14px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-bottom: 20px;
      }

      .site-header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 10px;
      }

      .favicon {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        display: none;
        flex-shrink: 0;
      }

      h1 {
        margin: 0;
        font-size: 21px;
        font-weight: 700;
        line-height: 1.3;
        word-break: break-word;
      }

      .url {
        color: var(--text-muted);
        font-size: 13px;
        background: rgba(15, 23, 42, 0.65);
        border: 1px solid var(--border);
        padding: 8px 12px;
        border-radius: 10px;
        margin: 12px 0 24px;
        word-break: break-all;
      }

      .reload-btn {
        background: linear-gradient(135deg, #fb923c 0%, #f97316 100%);
        color: #ffffff;
        border: none;
        padding: 13px 28px;
        border-radius: 11px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.2s;
        box-shadow: 0 6px 18px rgba(249, 115, 22, 0.32);
      }

      .reload-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 24px rgba(249, 115, 22, 0.45);
      }

      .hint {
        margin-top: 14px;
        font-size: 12px;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">Tab Suspended to Save RAM</div>
      <div class="site-header">
        <img id="favicon" class="favicon" alt="" />
        <h1 id="pageTitle">Suspended Tab</h1>
      </div>
      <div id="pageUrl" class="url"></div>
      <button id="reloadBtn" class="reload-btn">Reload Tab</button>
      <div class="hint">Click anywhere on this page or press Enter to restore</div>
    </div>
    <script src="suspended.js"></script>
  </body>
</html>
